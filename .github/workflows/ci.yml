name: CI

# Action versions must target Node 24 (checkout@v7, setup-node@v7).
# Node 20 actions are deprecated on GitHub runners.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # One run per commit. No cancellation: an older commit must still finish.
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Syntax check + unit tests
        run: npm run check

      - name: Generated seed is up to date
        run: |
          npm run seed
          git diff --exit-code -- js/config/seed.js

  # Single stable check for branch protection. Require this one in GitHub.
  ci-success:
    name: ci-success
    needs: [unit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Unit job must have passed
        run: |
          echo "unit: ${{ needs.unit.result }}"
          if [ "${{ needs.unit.result }}" != "success" ]; then
            echo "CI failed — merging is blocked."
            exit 1
          fi
          echo "CI passed."

  # Publishes the static app after CI. Requires one-time repository setup:
  # Settings → Pages → Build and deployment → Source: GitHub Actions.
  # Only runs for main (push or manual dispatch), never for pull requests.
  build:
    name: build
    needs: [ci-success]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R css js assets i18n _site/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: deploy
    needs: [build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
